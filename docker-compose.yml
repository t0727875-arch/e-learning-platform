services:
  db:
    image: postgres:16
    container_name: elearn-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: elearn
      POSTGRES_USER: elearn
      POSTGRES_PASSWORD: elearn
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: elearn-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: elearn-api
    ports:
      - "3000:3000"
    volumes:
      - ./apps/api:/app/apps/api
      - /app/apps/api/node_modules
      - ./packages/shared:/app/packages/shared
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://elearn:elearn@db:5432/elearn
      REDIS_URL: redis://redis:6379
      DISABLE_VITE: "1"
    depends_on:
      - db
      - redis
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: elearn-web
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web:/app/apps/web
      - /app/apps/web/node_modules
      - ./packages/shared:/app/packages/shared
    depends_on:
      - api
    env_file:
      - .env
    restart: unless-stopped

  mobile:
    container_name: elearn-mobile
    build:
      context: .
      dockerfile: docker/mobile.Dockerfile
    volumes:
      - ./apps/mobile:/app/apps/mobile
      - /app/apps/mobile/node_modules
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    environment:
      NODE_ENV: development
      EXPO_NO_TELEMETRY: "1"
      EXPO_DEVTOOLS_LISTEN_ADDRESS: "0.0.0.0"
      EXPO_PUBLIC_API_URL: http://192.168.107.239:3000
    depends_on:
      - api
    stdin_open: true
    tty: true

volumes:
  postgres_data:
  redis_data:
